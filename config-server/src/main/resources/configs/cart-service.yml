spring:
  application:
    name: cart-service

  datasource:
    url: jdbc:postgresql://localhost:5432/cart_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
server:
  port: 8084