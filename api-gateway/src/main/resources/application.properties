spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

management.endpoints.web.exposure.include=*

# Routes
spring.cloud.gateway.mvc.routes[0].id=user-service
spring.cloud.gateway.mvc.routes[0].uri=lb://user-service
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.mvc.routes[1].id=admin-service
spring.cloud.gateway.mvc.routes[1].uri=lb://admin-service
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/admin/**

spring.cloud.gateway.mvc.routes[2].id=product-service
spring.cloud.gateway.mvc.routes[2].uri=lb://product-service
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/products/**

spring.cloud.gateway.mvc.routes[3].id=cart-service
spring.cloud.gateway.mvc.routes[3].uri=lb://cart-service
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/cart/**

spring.cloud.gateway.mvc.routes[4].id=wishlist-service
spring.cloud.gateway.mvc.routes[4].uri=lb://wishlist-service
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/wishlist/**

spring.cloud.gateway.mvc.routes[5].id=customer-service
spring.cloud.gateway.mvc.routes[5].uri=lb://customer-service
spring.cloud.gateway.mvc.routes[5].predicates[0]=Path=/api/customers/**

spring.cloud.gateway.mvc.routes[6].id=order-service
spring.cloud.gateway.mvc.routes[6].uri=lb://order-service
spring.cloud.gateway.mvc.routes[6].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.mvc.routes[7].id=feedback-service
spring.cloud.gateway.mvc.routes[7].uri=lb://feedback-service
spring.cloud.gateway.mvc.routes[7].predicates[0]=Path=/api/feedback/**
management.endpoint.gateway.enabled=true
spring.cloud.gateway.mvc.enabled=true