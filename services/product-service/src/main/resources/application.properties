spring.application.name=product-service
spring.config.import=optional:configserver:http://localhost:8888
server.port=8083
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.datasource.url=${PRODUCT_DB_URL:jdbc:postgresql://localhost:5432/product_db}
spring.datasource.username=${PRODUCT_DB_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${PRODUCT_DB_PASSWORD:${DB_PASSWORD:postgres}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect